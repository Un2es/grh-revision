<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRH — Révision Express | Youness Alilou</title>
  <style>
    :root {
      --bg: #0d1526;
      --card: #16213e;
      --card2: #1a2a4a;
      --accent: #4f9eff;
      --green: #22d3a4;
      --yellow: #f5c842;
      --red: #f87171;
      --purple: #a78bfa;
      --orange: #fb923c;
      --pink: #f472b6;
      --teal: #2dd4bf;
      --text: #e2e8f0;
      --muted: #7d90b0;
      --border: #1e3055;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 20px 16px 60px;
    }
    /* ── HEADER ── */
    .header {
      text-align: center;
      padding: 24px 0 20px;
    }
    .header .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .header h1 {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .header .sub {
      font-size: 13px;
      color: var(--muted);
    }
    .header .author {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 14px;
      border-radius: 50px;
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
    }
    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 20px 0 28px;
    }
    .tab-btn {
      padding: 10px 30px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s;
      background: var(--card);
      color: var(--muted);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      box-shadow: 0 4px 20px #4f9eff44;
    }
    /* ── PANELS ── */
    .panel { display: none; max-width: 700px; margin: 0 auto; }
    .panel.active { display: block; }
    /* ── ACCORDION ── */
    .acc-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .acc-item.open { border-color: var(--acc-color, var(--accent)); }
    .acc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
    }
    .acc-left { display: flex; align-items: center; gap: 10px; }
    .acc-icon { font-size: 20px; }
    .acc-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      transition: color 0.2s;
    }
    .acc-item.open .acc-title { color: var(--acc-color, var(--accent)); }
    .acc-arrow {
      font-size: 18px;
      color: var(--acc-color, var(--accent));
      transition: transform 0.25s;
      display: inline-block;
    }
    .acc-item.open .acc-arrow { transform: rotate(180deg); }
    .acc-body {
      display: none;
      padding: 4px 18px 16px;
      border-top: 1px solid var(--border);
    }
    .acc-item.open .acc-body { display: block; }
    .acc-point {
      padding: 10px 14px;
      margin: 6px 0;
      background: var(--card2);
      border-radius: 10px;
      border-left: 3px solid var(--acc-color, var(--accent));
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text);
    }
    /* ── QCM ── */
    .qcm-wrap { max-width: 600px; margin: 0 auto; }
    .progress-bar-bg {
      height: 6px;
      background: var(--card);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 3px;
      transition: width 0.4s;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .q-label {
      font-size: 11px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .q-text { font-size: 16px; font-weight: 600; line-height: 1.55; }
    .opt {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
      display: block;
      width: 100%;
      text-align: left;
      color: var(--text);
    }
    .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--card2); }
    .opt:disabled { cursor: default; }
    .opt.correct { background: #052e16; border-color: var(--green); }
    .opt.wrong { background: #2d1515; border-color: var(--red); }
    .opt .letter { font-weight: 700; color: var(--accent); margin-right: 8px; }
    .explication {
      background: #0d2137;
      border: 1px solid #4f9eff44;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 13.5px;
      line-height: 1.6;
      display: none;
    }
    .explication.show { display: block; }
    .explication strong { color: var(--accent); }
    .next-btn {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: none;
    }
    /* ── RESULTS ── */
    .results { text-align: center; display: none; }
    .results .trophy { font-size: 64px; margin-bottom: 16px; }
    .results .score-big { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
    .results .score-msg { font-size: 16px; color: var(--muted); margin-bottom: 24px; }
    .results .res-bar-bg { height: 14px; background: var(--card); border-radius: 8px; overflow: hidden; margin-bottom: 28px; }
    .results .res-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--accent)); border-radius: 8px; transition: width 1s ease; }
    .results .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      padding: 12px 28px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-secondary {
      padding: 12px 28px;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    /* ── FOOTER ── */
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: var(--muted);
    }
    .footer a { color: var(--accent); text-decoration: none; }
    /* ── HINT ── */
    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">

        <div id="options-list"></div>

          <strong>💡 Explication : </strong><span id="explication-text"></span>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Question suivante →</button>
      </div>

      <div class="results" id="results">
        <div class="trophy" id="trophy">🏆</div>
        <div class="score-big" id="score-big"></div>

        <div class="res-bar-bg">
          <div class="res-bar-fill" id="res-bar" style="width:0%"></div>

        <div class="btns">
          <button class="btn-primary" onclick="resetQuiz()">🔄 Recommencer</button>
          <button class="btn-secondary" onclick="switchTab('resume')">📋 Réviser</button>
        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    Made by <a href="https://un2es.github.io/Youness-Alilou/" target="_blank">Youness Alilou</a> · FSJES Meknès 2025/2026
  </div>

<script>
// ════════════════════════════════

const sections = [

      "📌 <b>Développement des RH</b> : évaluation de la performance & du potentiel + déterminer les besoins en formation + actions de formation",

  {

    points: [
      "💡 <b>Compétences</b> : Savoir = connaissance | Savoir-faire = Hard skills (technique) | Savoir-être = Soft skills (personnalité)",
      "📄 <b>CDI</b> (sans limite de durée) | <b>CDD</b> (tâche précise & temporaire) | <b>CTT</b> : ETT → contrat de mise à disposition (ETT↔entreprise) + contrat de mission (ETT↔salarié intérimaire)",
      "🏢 <b>Acteurs</b> : Entreprise elle-même (postes répétitifs, candidatures spontanées) | Cabinet (profils méconnus) | Chasseur de têtes (postes stratégiques) | ANAPEC (cadres)",

  {

    points: [

      "⚙️ <b>Ingénierie en 4 étapes</b> : ① Analyser les besoins (organisationnels, liés à l'emploi, individuels) → ② Contexte & stratégie globale → ③ Choisir les méthodes → ④ Évaluer & suivre",
      "📊 <b>Évaluation</b> : <b>Ante</b> = avant la formation (identifier besoins) | <b>À chaud</b> = juste après (satisfaction & acquis) | <b>À froid</b> = quelques mois après (transfert + résultats)",

  },
  {
    icon: "🚀", title: "Gestion des Carrières", color: "#a78bfa",
    points: [
      "📈 <b>Typologies</b> : Traditionnelle (progression dans 1 seule org.) | Protéenne (gérée par l'individu, accomplissement de soi) | Nomade (mobilité inter-organisations & géographique)",
      "🔄 <b>Mobilité</b> : Verticale = promotion hiérarchique | Latérale = autre fonction, même niveau | Horizontale = même fonction, autre poste",
      "📅 <b>Stades Hall 1976</b> : Exploration (5-25 ans) → Établissement & avancement (26-40 ans) → Stabilisation : croissance/maintien/stagnation (41-65 ans) → Retraite (65+)",
      "🛠️ <b>Outils</b> : Entretien annuel (savoir/savoir-faire/savoir-être, obligation salarié) | Bilan de compétences (→ projet professionnel) | Assessment centers (simulations) | Évaluation 360° (multi-sources)",
    ]
  },
  {
    icon: "💰", title: "Rémunération", color: "#fb923c",
    points: [
      "💵 <b>Directe</b> (sur bulletin de paie) : salaire de base + heures sup + primes fixes + gratifications + avantages en nature",
      "🏥 <b>Indirecte</b> (hors fiche de paie) : cotisations CNSS / AMO / CIMR + assurance complémentaire (maladie, invalidité)",

      "📊 <b>Masse salariale</b> = rémunérations <u>BRUTES</u>. Elle varie selon : effectifs + évolution des structures + mesures générales (SMIG) + mesures individuelles (augmentations personnelles)",
    ]
  },
  {
    icon: "⏰", title: "Gestion du Temps — Matrice Covey", color: "#f472b6",
    points: [
      "🔴 <b>Q1 Urgent + Important</b> → GÉRER : crises, licenciement abusif, urgences médicales",
      "🟢 <b>Q2 Non urgent + Important</b> → ⭐ LE PLUS IMPORTANT : planification, formation, prévention, construction de relations",
      "🟡 <b>Q3 Urgent + Pas important</b> → DÉLÉGUER : interruptions, certains emails, demandes répétitives",
      "⚫ <b>Q4 Ni urgent ni important</b> → ÉLIMINER : newsletters inutiles, réunions sans valeur, distractions",

  {

      "6️⃣ <b>Remplacer le dangereux</b> par moins dangereux (peinture à eau < solvants) | 7️⃣ <b>Planifier la prévention</b> (intégrer sécurité dès la conception)",

  {
    icon: "⚡", title: "Gestion des Conflits", color: "#f87171",

const qcms = [
  { q: "Le processus RH est constitué de 4 catégories. Laquelle N'en fait PAS partie ?", opts: ["La planification des RH", "L'organisation des RH", "La conservation des RH", "L'acquisition des RH"], a: 1, exp: "Les 4 catégories sont : Planification, Acquisition, Développement et Conservation. 'L'organisation' n'en fait pas partie." },

  { q: "Pourquoi le Quadrant 2 est-il le plus important selon Covey ?", opts: ["Il traite les urgences immédiates", "Il réduit uniquement les coûts", "Il favorise la prévention, la croissance durable et la réduction du stress", "Il élimine totalement les conflits"], a: 2, exp: "Le Q2 = Non urgent mais Important. Se concentrer dessus permet de PRÉVENIR les crises (Q1), réduire le stress et assurer une croissance durable." },

  { q: "L'entretien annuel d'évaluation : pour le salarié, c'est :", opts: ["Un droit qu'il peut refuser", "Une obligation (il ne peut pas refuser)", "Facultatif pour les non-cadres", "Une sanction disciplinaire"], a: 1, exp: "L'entretien annuel est un DROIT pour l'employeur et une OBLIGATION pour le salarié. Il ne peut pas refuser l'entretien programmé." },

  { q: "Yassine, 18 ans dans la même entreprise, passé d'assistant RH à Directeur RH. C'est :", opts: ["Carrière nomade", "Carrière protéenne", "Carrière traditionnelle", "Mobilité horizontale"], a: 2, exp: "Carrière TRADITIONNELLE = progression hiérarchique dans UNE SEULE organisation sur le long terme." },
  { q: "Une évaluation faite immédiatement à la fin d'une formation s'appelle :", opts: ["Évaluation ante", "Évaluation à chaud", "Évaluation à froid", "Évaluation 360°"], a: 1, exp: "À CHAUD = juste après la formation (satisfaction et acquis) | À FROID = quelques mois après (transfert et résultats) | Ante = avant la formation." },
  { q: "Une machine dangereuse remplacée par un équipement moderne sécurisé. C'est le principe :", opts: ["Donner les instructions appropriées", "Tenir compte de l'évolution de la technique", "Adapter le travail à l'homme", "Évaluer les risques"], a: 1, exp: "Principe n°5 : TENIR COMPTE DE L'ÉVOLUTION DE LA TECHNIQUE = remplacer les équipements obsolètes par des machines modernes plus sécurisées." },
  { q: "Peinture aux solvants remplacée par peinture à base d'eau. C'est :", opts: ["Évaluer les risques", "Remplacer le dangereux par ce qui l'est moins", "Planifier la prévention", "Éviter les risques"], a: 1, exp: "Principe n°6 : REMPLACER LE DANGEREUX par ce qui l'est moins. Exemple typique : peinture à eau à la place de solvants toxiques." },
  { q: "L'augmentation du SMIG est considérée comme :", opts: ["Mesure individuelle", "Mesure générale", "Évolution des effectifs", "Évolution des structures"], a: 1, exp: "Les mesures GÉNÉRALES = augmentations collectives qui s'appliquent à tout ou partie des salariés (ex : revalorisation du SMIG par l'État)." },
  { q: "Le bilan de compétences vise principalement à :", opts: ["Déterminer le salaire futur", "Définir un projet professionnel", "Évaluer la rentabilité de l'entreprise", "Organiser une mobilité verticale"], a: 1, exp: "Le bilan de compétences permet d'analyser ses compétences, aptitudes et motivations pour DÉFINIR UN PROJET PROFESSIONNEL réaliste." },
  { q: "La collaboration est la stratégie la plus efficace car :", opts: ["Elle évite tout dialogue", "Elle favorise uniquement le résultat", "Elle protège à la fois la relation ET le résultat", "Elle impose une solution rapide"], a: 2, exp: "La COLLABORATION = stratégie gagnant/gagnant. Elle satisfait les besoins des deux parties : à la fois le résultat ET la relation. La plus durable." },
];

// ════════════════════════════════
//  ACCORDION BUILD
// ════════════════════════════════

const accEl = document.getElementById('accordion');
sections.forEach((s, i) => {
  const item = document.createElement('div');
  item.className = 'acc-item';
  item.style.setProperty('--acc-color', s.color);
  item.innerHTML = `
    <div class="acc-header" onclick="toggleAcc(${i})">
      <div class="acc-left">
        <span class="acc-icon">${s.icon}</span>
        <span class="acc-title">${s.title}</span>
      </div>
      <span class="acc-arrow">▾</span>
    </div>
    <div class="acc-body">
      ${s.points.map(p => `<div class="acc-point">${p}</div>`).join('')}
    </div>`;
  accEl.appendChild(item);
});

function toggleAcc(i) {
  const items = document.querySelectorAll('.acc-item');
  items[i].classList.toggle('open');
}

// ════════════════════════════════
//  TABS
// ════════════════════════════════

function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => {
    if (b.getAttribute('onclick').includes(name)) b.classList.add('active');
  });
}

// ════════════════════════════════
//  QCM ENGINE
// ════════════════════════════════

let qi = 0, score = 0, answered = false;

function loadQuestion() {
  const q = qcms[qi];
  document.getElementById('q-label').textContent = `QCM #${qi + 1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-counter').textContent = `Question ${qi + 1} / ${qcms.length}`;
  document.getElementById('q-score').textContent = `Score : ${score} ✅`;
  document.getElementById('progress-fill').style.width = `${(qi / qcms.length) * 100}%`;
  document.getElementById('explication').classList.remove('show');
  document.getElementById('next-btn').style.display = 'none';
  answered = false;

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="letter">${letters[i]}.</span>${opt}`;
    btn.onclick = () => selectOpt(i);
    list.appendChild(btn);
  });
}

function selectOpt(i) {
  if (answered) return;
  answered = true;
  const q = qcms[qi];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add('correct');
  if (i === q.a) {
    score++;
    btns[i].innerHTML = '✅ ' + btns[i].innerHTML;
  } else {
    btns[i].classList.add('wrong');
    btns[i].innerHTML = '❌ ' + btns[i].innerHTML;
  }
  document.getElementById('explication-text').textContent = q.exp;
  document.getElementById('explication').classList.add('show');
  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  nb.textContent = qi + 1 >= qcms.length ? 'Voir mes résultats →' : 'Question suivante →';
}

function nextQuestion() {
  qi++;
  if (qi >= qcms.length) {
    showResults();
  } else {
    loadQuestion();
  }
}

function showResults() {
  document.getElementById('quiz-area').style.display = 'none';
  const res = document.getElementById('results');
  res.style.display = 'block';
  const pct = Math.round((score / qcms.length) * 100);
  const trophies = pct >= 85 ? '🏆' : pct >= 70 ? '🌟' : pct >= 50 ? '💪' : '📚';
  document.getElementById('trophy').textContent = trophies;
  document.getElementById('score-big').textContent = `${score} / ${qcms.length} — ${pct}%`;
  const msgs = ['Révise encore le résumé, tu peux le faire !', 'Pas mal ! Continue à réviser 📖', 'Bien ! Encore un peu d\'effort 💪', 'Très bien ! Tu maîtrises bien 👍', 'Excellent ! Tu es prêt pour l\'exam 🎉'];
  document.getElementById('score-msg').textContent = msgs[Math.min(4, Math.floor(pct / 20))];
  setTimeout(() => { document.getElementById('res-bar').style.width = pct + '%'; }, 100);
}

function resetQuiz() {
  qi = 0; score = 0; answered = false;
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  loadQuestion();
}

// INIT
loadQuestion();
</script>
